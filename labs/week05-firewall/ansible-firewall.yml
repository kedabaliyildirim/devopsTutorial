- name: Configure nftables firewall
  hosts: all
  become: true
  tasks:
    - name: Copy nftables.conf
      copy:
        src: nftables.conf
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: '0644'

    - name: Enable and start nftables
      service:
        name: nftables
        state: started
        enabled: yes

    - name: Apply ruleset
      command: nft -f /etc/nftables.conf
